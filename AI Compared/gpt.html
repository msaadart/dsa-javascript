<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gpt Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #111827);
            overflow: hidden;
        }
        
        .calculator {
            width: 360px;
            padding: 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.05);
        }
        
        .display {
            width: 100%;
            height: 100px;
            border: none;
            outline: none;
            border-radius: 20px;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            text-align: right;
            font-size: 2.2rem;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        
        button {
            height: 70px;
            border: none;
            border-radius: 18px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s ease;
            color: white;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2), inset 0 0 5px rgba(255, 255, 255, 0.1);
        }
        
        button:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .operator {
            background: linear-gradient(135deg, #ff6b6b, #ff3b3b);
        }
        
        .equal {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            grid-column: span 2;
        }
        
        .clear {
            background: linear-gradient(135deg, #ffb347, #ff8300);
        }
        
        .special {
            background: linear-gradient(135deg, #7f5af0, #6246ea);
        }
        
        .title {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="title">Advanced Calculator</div>

        <input type="text" class="display" id="display" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button class="special" onclick="deleteLast()">DEL</button>
            <button class="special" onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="special" onclick="appendValue('.')">.</button>
            <button onclick="appendValue('0')">0</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <script>
        const display = document.getElementById("display");

        function appendValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch {
                display.value = "Error";
            }
        }

        // Keyboard Support
        document.addEventListener("keydown", (e) => {
            const allowed = "0123456789+-*/.%";

            if (allowed.includes(e.key)) {
                appendValue(e.key);
            } else if (e.key === "Enter") {
                calculate();
            } else if (e.key === "Backspace") {
                deleteLast();
            } else if (e.key === "Escape") {
                clearDisplay();
            }
        });
    </script>

</body>

</html>
